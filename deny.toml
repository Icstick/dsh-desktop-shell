# cargo-deny configuration (M8-D): license + advisory policy
[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[advisories]
version = 2
yanked = "deny"
# All ignored advisories are unmaintained-only (no security fix exists;
# every one is a transitive dependency of tauri v2's Linux stack or its
# build macros). Real vulnerabilities stay enabled and would fail CI.
ignore = [
  # gtk-rs GTK3 bindings (tauri v2 Linux webkit stack; no maintained
  # replacement upstream uses yet)
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  # proc-macro-error (build-time macro helper in the tauri macro chain)
  "RUSTSEC-2024-0370",
  # rust-unic Unicode crates (i18n dependency chain)
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
