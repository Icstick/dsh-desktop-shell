[package]
name = "dsh-local-transport"
version = "0.1.0"
description = "Authenticated length-prefixed loopback transport for local IPC (MOD-LOCAL-TRANSPORT)"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Icstick/dsh-desktop-shell"
publish = false

[lib]
name = "dsh_local_transport"
path = "src/lib.rs"

[dependencies]
getrandom = "=0.3.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
# Safe SO_PEERCRED access for the UDS peer-identity carrier (nix wraps the
# getsockopt call; the crate stays unsafe-free on Linux).
nix = { version = "0.30", default-features = false, features = ["socket"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS has no safe wrapper for getsockopt(LOCAL_PEERPID) or proc_pidpath;
# both live in the crate's documented peer-identity unsafe exemption
# (see src/peer.rs). Already in the tree via nix on Linux.
libc = "0.2"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
