[package]
name = "dsh-adapter-dsh-std"
version = "0.1.0"
description = "Optional dsh-std adapter: conformance tri-state, negotiation, facets, degrade (MOD-ADAPTER-DSH-STD, ADR-0018)"
authors = ["DSH Desktop Shell contributors"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Icstick/dsh-desktop-shell"
publish = false

[lib]
name = "dsh_adapter_dsh_std"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
