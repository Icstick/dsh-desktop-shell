findings:
  - "HIGH activateEnvironment 闭包竞态——切换 managed→managed 时 stop 旧环境后 startManaged 用旧闭包 validatedEnvironment 再次启动旧环境；attached→managed 时 startManaged 因旧闭包 ownership=attached 提前 return 导致目标环境根本不启动（apps/desktop/features/shell-ui/src/ShellApp.tsx:447-476 activateEnvironment、487-504 startManaged：setValidatedEnvironment(environment) 为异步状态更新，异步链内 startManaged/stopManaged 读取的仍是点击渲染时的闭包值；EnvironmentList.activate 在 try 内同步调 onActivated，ShellApp 在 setActiveEnvironment await 期间无重渲染，闭包必然陈旧）。后果：catalog 持久化 active=B 但运行进程是 A（或无一进程），UI 活跃标记与真实运行时漂移；再点 Activate 触发 supervisor 单槽冲突。修复：startManaged/stopManaged 改为显式接收 environment 参数（参照 SetupWizard finish 直调 api.startManagedEnvironment({environmentId: environment.id}) 的正确写法），或用 useRef 跟踪最新 validatedEnvironment。"
  - "MEDIUM 编排顺序与失败窗口——实现顺序为 activate(catalog 持久化)→stop→start，而 EnvironmentList 注释/PLAN-M7/WI AC 声明的语义是 stop 当前→start 目标（EnvironmentList.tsx:3-4、ShellApp.tsx:454-455）：catalog 是持久真源，先切换意味着 stop 或 start 任一失败后，持久状态已指向新环境而旧环境可能已停、新环境未起，恢复需手动再 Activate。修复：编排改为 stop 旧→start 新→最后 setActiveEnvironment（失败则保持旧 active），或至少把 stop/start 失败暴露为明确状态并回滚 active。"
  - "MEDIUM finish 步骤重复 CTA——SetupWizard.tsx:324-333（导航栏 Save & launch，wizard-finish）与 624-626（FinishStep 内部 Save & launch，finish-save）为同动作双按钮，busy 文案同时变 Working…，易混淆且为冗余 DOM。建议删除内部按钮，保留导航栏单一 CTA（ShellApp.test 已按 finish-save 点击，需同步）。"
  - "MEDIUM i18n 约定违反（M6-F）——SetupWizard/EnvironmentList 约 40 条硬编码英文（Mode/Back/Next/Save & launch/Searching…/The environment could not be activated…），未注册 src/i18n.tsx translations 表；当前 zh=en 无功能影响（HANDOFF remaining 已自认『与既有 UI 一致』），但 M7 是向导首次全量落地，把新文案放进表内成本最低。建议：合入前注册 setup.* / environmentList.* 键（zh/en 暂同值），后续真实中文填充时随表更新。"
  - "LOW probe 端口范围与后端策略不一致——SetupWizard runProbe 允许 1..65535（SetupWizard.tsx:136），后端固定端口策略要求 >=1024（commands.rs:1127 is_valid_port）；探测 80/443 显示 free 但 review 校验会拒绝，探测结果与最终校验可能矛盾。建议前端探测前过滤 <1024 或提示。"
  - "LOW 保存成功但启动失败误报——wizard finish 的 catch 统一报『The environment could not be saved or launched』（SetupWizard.tsx:202-203）：saveEnvironment 成功后 startManagedEnvironment 失败（如单槽 supervisor Conflict）时环境已入 catalog，用户会误以为保存失败而重试产生重复环境。建议分离 saved/launch 两个错误状态（savedRevision 已能佐证保存成功）。"
  - "LOW 激活失败语义——EnvironmentList catch 统一『could not be activated』（EnvironmentList.tsx:39-40），但 setActiveEnvironment 已成功、后续编排（stop/start）失败时 catalog 已切换，报错文案与实际状态不符；且 onActivated 异常路径无状态回滚。"
  - "LOW 同步命令占主线程——probe_port（≤300ms 有界）、discover_profiles、set_active_environment 均为同步 #[tauri::command]，Tauri 下跑主线程；单次有界可接受，但向导若连点 Check 会短暂卡 UI。建议转 async 或 #[tauri::command(async)]。"
  - "LOW tracking 收尾——两个 WI evidence 空数组（应链入 63/63、QA 6/6、本评审）；M7.yaml 退出标准『catalog 双份打通』与 WI-M7-SETUP-WIZARD AC③『daemon environments.json』为 PLAN-M7 修正前的旧表述（应为单文件共享）；HANDOFF risks 应补充 HIGH-1 竞态认知。"
