    evidence: "新增测试覆盖协议行为扎实：daemon 105（lib 69 + 集成 36：daemon_integration 5/browser 10/runtime 4/scheduler_wake 7/split_brain 5/terminal 5）+ transport 28 全绿（复跑 exit 0）；split_brain 真进程双实例（退出码 3/4、陈旧锁接管、外部进程占端口）；live QA 22/22（复跑 PASS，A1-A18 直连全流程 + B1-B4）。⚠️ 关键缺失：无任何「Shell 重启→重连存活 daemon」契约测试（全部测试 spawn 新 daemon），重启重连路径是 M6 核心退出标准却零覆盖；QA B4「Shell restart」只断言 Shell 进程存活（重启后 Shell 实际卡在握手重试，进程照样活着）——假阳性检查；真实 DSH 的 dsh-surface token-less binding 路径无自动化覆盖。已知降级点均留 TODO：server.rs ×2（lease 撤销/固定端口）、browser.rs ×2（navigate 状态上报）、daemon_client.rs 模块文档（凭证重签）。"
