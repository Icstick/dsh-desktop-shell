findings:
  - "HIGH 凭证一次性 + 无重新签发 → Shell 重启永远无法重连存活 daemon（crates/daemon/src/main.rs:112 仅启动时 issue_credential 一次并写文件；crates/local-transport/src/server.rs authenticate() 首次握手消耗；apps/desktop/src-tauri/src/daemon_client.rs start_background 用同一已消耗 token 每 2s 重试）——M6 核心退出标准「Shell restart 不影响 DSH/PTY 资源存活」不成立：资源存活但不可达不可控（terminal/browser 会话 owner 绑定死连接，write/close 恒 NOT_PROCESS_OWNER；事件订阅随连接销毁无重订路径）。实证：daemon 起→首连 accepted:true→二次同 token accepted:false(reason:replay)。daemon_client.rs 模块文档声称「Shell restart re-reads the file the daemon re-issued」与实现不符。QA B4 只验 Shell 进程存活，未验重连。修复：daemon 在每次连接断开（或凭证被消耗）后重新 issue 一次性 credential 并原子重写 daemon-credential.json；Shell 侧对 Replay 错误重读文件重试；补「Shell 重启重连存活 daemon」集成测试与 QA B4 真实断言语义。"
  - "HIGH broker-relaxed 授权旁路（crates/daemon/src/server.rs handle_hello Conflict 分支 + handle_invocation generation==0 跳过 enforce_dispatch）：首个持 grant 参与方之外，任何持 credential 的参与方（含 agent_automation 代理）协商冲突后 Agreement 仍授予能力且 broker 门禁被跳过——弱化 ADR-0014「所有 Agent native action 先经过 broker」与 M5 授权链（grant/lease/scope）对非首个参与方的约束；terminal_integration.rs 测试固化此语义为「M6-C1 决策」。修复建议（三选一）：① credential-only 路径仅对 Shell 参与方身份（component=dsh-desktop-shell/facet=shell）开放，其他参与方必须 broker-backed；② Conflict 时将该能力列入 unavailable(PolicyDenied) 而非授予；③ 为 broker-relaxed activation 增加显式 human-surface 标记并拒绝 agent_automation 模式请求。"
  - "MEDIUM ADR-0019 决策 4 实现偏离：决策文本要求 Windows named mutex（dev.dsh.desktop-shell.daemon）+ 端口双重检测；实现为 claim 端口 37771 + daemon.lock 文件（singleton.rs），代码注释称「named-mutex variant 是 M6-D」但 M6-D 已交付仍未实现，ADR 未修订。功能等效（lockfile 陈旧恢复+端口权威）且测试充分（split_brain 5 tests），但按 AGENTS.md「原因真源在 ADR」需修订 ADR 或补 mutex。"
  - "MEDIUM browser Plan A 部分实现（ADR-0019 决策 2：URL/binding 状态权威在 daemon）：daemon 仅持有 create/close/list（browser.rs），navigate/snapshot 仍 Shell 本地且不上报（browser.rs:614/692 TODO(M6-C4)）；Shell 重启后 daemon 的 currentUrl 恒 null、与渲染真实状态漂移。修复：M6 内补 browser.navigate 上报方法或明示降级范围。"
  - "MEDIUM dsh-surface binding 丢失 bootstrap token（apps/desktop/src-tauri/src/managed_runtime.rs verified_surface_binding + daemon runtime report 无 URL 字段）：Shell 重建的 binding URL=裸 origin（http://127.0.0.1:port），M1-M5 私密 bootstrap URL 不再可得；dsh_surface navigate 该 URL 后真实 DSH 的鉴权行为未验证（无真实 DSH 自动化覆盖）。建议 M7 前用真实 DSH 验证或经 daemon 增加已验证 URL 透传（token 不出 supervisor 的前提下）。"
  - "LOW SessionState.seen_ids 无界增长（crates/daemon/src/server.rs SessionState）：每连接每消息 id 永久留存，对抗性同用户客户端可无限流帧增长内存（id 8..128 字符）。建议上限（如 10k 后滚动淘汰）。"
  - "LOW daemon_client 命令队列无界（apps/desktop/src-tauri/src/daemon_client.rs worker_loop commands 通道）：daemon 卡顿时 UI 可无限入队；调用侧有 60s recv_timeout 兜底。建议有界+溢出即错。"
  - "LOW terminal-provider 5ms PeekNamedPipe 轮询（crates/terminal-provider/src/lib.rs spawn_output_reader）：每会话 ~200 wakeups/s 空闲轮询；可接受但多会话时放大。可选 WaitForSingleObject(pipe, 50ms) 或加长 tick。"
  - "LOW tracking 滞后：M6.yaml status proposed、WI-M6-DAEMON in_progress（应 review）、CURRENT.md 下一动作陈旧、WI-M6-I18N 重复 YAML 键、IF-TERMINAL/IF-BROWSER updated_at 时区疑混用。"
  - "LOW 计数修复理论边角（crates/local-transport/src/server.rs connection_worker）：stats mutex 中毒时 panic 跳过 limiter.release → 槽位泄漏（需先有 panic 才触发；可 release 前不 panic 化）。"
