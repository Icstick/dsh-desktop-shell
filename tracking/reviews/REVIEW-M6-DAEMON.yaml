checks:
  - id: adr-alignment
    status: failed
    evidence: "claim 端口 37771（singleton.rs CLAIM_PORT 持有+探活）✅；凭证文件一次性（credential.rs 原子写+local-transport AC-IPC-001 消耗）✅ 但无重新签发 → 决策 3 handover「Shell 重建 UI/资源接管」不可达（HIGH-1）；envelope 协商（Hello→Agreement→broker grant，server.rs handle_hello）✅；browser Plan A（渲染在 Shell/状态权威在 daemon）⚠️ 部分（create/close/list 在 daemon，navigate/URL 状态不上报，browser.rs TODO(M6-C4)）；Shell 关闭不断开 daemon ✅（lib.rs 无退出钩子杀 daemon，QA B3 实证）；事件桥命名与 payload 保持 ✅（daemon_event_target 原样转发 terminal://output / browser://event）。偏差：ADR 决策 4 的 Windows named mutex 未实现（实现=claim 端口+lockfile，代码注释称 M6-D 补 mutex，但 M6-D 已交付仍无 mutex，ADR 未修订）；ADR 决策 5「固定 loopback 端口」为动态端口（server.rs TODO(M6-C)）；决策 3 broker lease 断开撤销缺失（server.rs:270 TODO(M6-C)）。"
  - id: security-semantics
    status: warn
    evidence: "reject_busy 修复（ff5bc27：reject 前 200ms 有界读帧防 RST）与计数顺序修复（47fa911：reply/槽位释放前先计数）经 transport 28 测试+双 40/40 压力验证，未引入新问题（理论边角：stats mutex 中毒时 panic 会跳过 limiter.release 槽位泄漏，仅先有 panic 才可能）。凭证生命周期：一次性+原子写 ✅；%APPDATA% 默认 ACL 同用户可读（威胁模型内）。envelope 校验 deny_unknown_fields+id 防重放+Result oneOf ✅。Shell fail-closed（无 daemon → UNAVAILABLE）✅。ACL 35 复跑通过。⚠️ broker-relaxed 授权旁路（server.rs handle_invocation generation==0 跳过 enforce_dispatch；handle_hello Conflict 时 Agreement 仍授予）：首个持 grant 参与者之外的同 credential 参与者可绕过 broker 门禁直接调用 terminal/browser/runtime 能力——含 agent_automation 参与方（terminal_integration 有测试固化此语义，M6-C1 明确决策，但弱化 ADR-0014「所有 agent action 先经 broker」）。"
  - id: correctness
    status: warn
    evidence: "daemon_client worker 模型：Result 按 replyTo/correlationId 关联（pending map）✅、事件有界队列 512 溢出丢弃 ✅、60s INVOKE_TIMEOUT ✅、send 失败合成 closed_result ✅；命令队列无界（LOW）。启动编排（探测→spawn→凭证≤10s→连接→2s 重试）在首次连接成功路径 ✅；但重试循环用已消耗 token 永远重试（HIGH-1，实证：首连 accepted:true、二次同 token accepted:false reason:replay）。错误映射 DaemonCommandError→前端命令错误三模块（terminal/browser/managed_runtime from_daemon）✅。verified_surface_binding 重新物化（daemon runtime.status → Shell 重建）✅ 但 bootstrap token 不再可得（report 无 URL 字段），Shell 侧 binding URL=裸 origin（MEDIUM-3，真实 DSH 行为未验证）。SessionRegistry::attach 语义（幂等拒绝重复/非法 id 拒绝/无事件）✅ + 3 测试。"
  - id: concurrency
    status: pass
    evidence: "PeekNamedPipe 死锁修复（3b71401）：stop 标志→关写端→TerminateProcess→ClosePseudoConsole→join reader→关读端，顺序正确；回归测试 close_with_no_pending_output_does_not_deadlock 在旧顺序会挂（channel 超时兜底）✅。LOW：5ms 轮询每会话 ~200 wakeups/s（可接受）。EventRouter：会话单订阅者、有界队列 256 丢弃、unsubscribe owner-scoped、连接断开后会话存活且事件停止（订阅随连接销毁）✅；但新连接无重新订阅路径（terminal/browser 会话 owner 绑定死连接 → 重启后 write/close 恒 NOT_PROCESS_OWNER，属 HIGH-1 同根）。"
