next_action: "Fix must-fix items before the M2 gate: FH-1 (CSPRNG credentials in local-transport), FH-2 (bounded registry/queues/threads), FM-1 (endpoint identity verification before publishing the token-bearing binding), FM-4 (status environment cross-check). Then re-run cargo clippy --all-targets -- -D warnings and cargo audit, and re-review. Track FM-2/FM-3/FM-5/FM-6/FM-7/FM-8 and FL-1..FL-10 in the WI-M2-RUNTIME backlog as hardening work items."
