# ------------------------------------------------------------------
# Findings detail summary (schema-compatible comment block)
# Severity counts: critical 0 | high 2 | medium 8 | low 10 | info 4
# MUST FIX (4): FH-1, FH-2, FM-1, FM-4
# FH-1 high    credential.rs:55-86,117-124      FNV-1a credentials predictable -> forge tokens
# FH-2 high    server.rs:188-202,295-323,...    unbounded registry/queues/threads -> local DoS
# FM-1 medium  managed_runtime.rs:615-658       TCP-only readiness -> token URL to non-DSH service
# FM-2 medium  managed_runtime.rs:757-795       harnessArgs after policy flags -> policy override
# FM-3 medium  commands.rs:490-813              sync commands block main thread up to 10.5s
# FM-4 medium  managed_runtime.rs:320-341       status mislabels foreign environment (must fix)
# FM-5 medium  managed_runtime.rs:525-542       restart ignores stop failure -> generation race
# FM-6 medium  managed_runtime.rs:464,851-863   endpoint release TOCTOU / port-reuse false positive
# FM-7 medium  dsh_surface.rs:488-593           child webview shares default profile with Shell
# FM-8 medium  managed_runtime.rs:300-318       explicit start resets recovery budget
# FL-1 low     managed_runtime.rs:1039-1199     spawn-to-job-assign race (orphan escape)
# FL-2 low     managed_runtime.rs:1201-1205     Windows stop always forced, never graceful
# FL-3 low     managed_runtime.rs:1223-1256     Unix setsid() escape (deferred platform)
# FL-4 low     environment_store.rs:142-218     Windows ACL/symlink sidecar/crash window
# FL-5 low     broker.rs:509-556                overlapping leases weaken revocation; no eviction
# FL-6 low     framing.rs:44-49                 encode_frame u32 length truncation >4GiB
# FL-7 low     managed_runtime.rs:587-613       first malformed candidate aborts start
# FL-8 low     dsh_surface.rs:831-853           force_unmount closes other-generation surface
# FL-9 low     managed_runtime.rs:272,652       token URL retained in supervisor memory
# FL-10 low    diagnostics.rs:200-203           whitelist round-trip .expect() panic
# FI-1 info    Cargo.lock                       audit: 0 vulns; 9 transitive warnings (glib unsound Linux-only)
# FI-2 info    local-transport design           plaintext loopback PoC, token-only gate
# FI-3 info    tauri.conf.json                  dev origin inside shell capability; bundle inactive
# FI-4 info    commands.rs:475-481              correlation ids predictable (non-secret)
# ------------------------------------------------------------------
