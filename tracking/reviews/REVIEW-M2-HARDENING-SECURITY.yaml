schema_version: 1
id: REVIEW-M2-HARDENING-SECURITY
scope: "M2 Reliable Runtime hardening security review: managed_runtime Supervisor (spawn/retained tree/Job Object, candidate parsing, token lifecycle, restart/recovery/safe stop, concurrency), dsh_surface WebView2 child (deny hooks, navigation gate, lifecycle, unsupported_platform), commands IPC boundary, diagnostics redaction, attached_health/discovery/environment_store/dsh_surface_policy, local-transport (credential/handshake/framing/limits/server/client), supervisor broker (grant/lease/dispatch), capabilities/shell.json + build.rs ACL"
status: failed
reviewers:
  - codex-security-review-m2
checks:
  - id: critical-severity
    status: passed
    evidence: "No critical-severity issues identified in scope."
  - id: high-severity
    status: failed
    evidence: "2 findings (FH-1, FH-2) flagged must_fix: predictable FNV-1a credentials in local-transport; unbounded credential registry/queues/threads enabling local DoS."
  - id: medium-severity
    status: failed
    evidence: "8 findings (FM-1..FM-8); FM-1 (endpoint identity before token delivery) and FM-4 (status mislabels foreign environment) flagged must_fix; FM-2/FM-3/FM-5/FM-6/FM-7/FM-8 recommended."
  - id: low-severity
    status: passed
    evidence: "10 advisory findings (FL-1..FL-10) recorded; none blocking; each carries a concrete fix."
  - id: info-severity
    status: passed
    evidence: "4 informational items (FI-1..FI-4), including audit warnings and dev-mode exposure."
  - id: tool-clippy
    status: passed
    evidence: "cargo clippy --all-targets -- -D warnings at workspace root: exit 0, zero diagnostics (cargo 1.98.0 / rustc 1.98.0, dev profile; all three workspace members incl. tests)."
  - id: tool-audit
    status: passed
    evidence: "cargo audit 0.22.2: 0 known vulnerabilities in the lockfile; 9 allowed warnings, all transitive (8 unmaintained via tauri-utils/urlpattern, 1 unsound glib 0.18.5 Linux-only, RUSTSEC-2024-0429)."
  - id: secrets-lifecycle
    status: passed
    evidence: "Token never leaves the backend: reports/diagnostics/surface status serialize no URL/query/token (tests authenticated_candidate_is_absent_from_public_runtime_report, ac_log_001_collect_redacts_token_cookie_query_and_bootstrap_url, surface_diagnostics_is_credential_free); no println!/log macros in production code; parse_candidate enforces exact loopback root with strict 43-char token charset. Residuals tracked as FM-1/FM-9."
  - id: input-validation
    status: passed
    evidence: "All IPC requests use schema_version + deny_unknown_fields + is_valid_id/bounds checks; candidate parsing rejects non-loopback/userinfo/fragment/port<1024; framing caps at 64 KiB with checked encode; discovery is bounded (16 paths/64 candidates/4096 chars); reserved launch args re-validated at launch. Residuals tracked as FM-2/FL-6/FL-7."
  - id: concurrency-process-boundary
    status: failed
    evidence: "Generation gates and short Mutex scopes are sound (no lock held across sleeps; Drop + Job Object KILL_ON_JOB_CLOSE backstop tree cleanup; PID reuse mitigated by retained handles). Residuals: FM-3 (main-thread blocking), FM-4 (foreign status), FM-5 (restart stop-failure), FM-6 (endpoint TOCTOU), FL-1 (spawn-assign race), FL-2/FL-3 (platform stop gaps)."
  - id: webview-acl
    status: passed
    evidence: "capabilities/shell.json matches webviews [\"shell\"] only — dsh-surface child matches no command; 18 commands consistent across lib.rs/build.rs/shell.json; CSP default-src 'self'; on_navigation/on_new_window/on_download/permission deny hooks installed before navigate; unsupported_platform fails closed; tauri =2.11.5 patched for GHSA-57fm-592m-34r7. Residual: FM-7 (shared profile)."
findings:
  - {"id":"FH-1","severity":"high","must_fix":true,"file":"crates/local-transport/src/credential.rs","lines":"55-86, 117-124","title":"Ephemeral credentials are FNV-1a-derived, not CSPRNG — tokens are predictable/forgeable","attack":"Token = FNV1a64(mix(instance_nonce(time_nanos ^ pid), counter, now_nanos)) ^ const. FNV-1a is a keyless, byte-wise invertible non-cryptographic hash and the counter increments sequentially, so any local process that observes a single token (loopback sniffing, plugin memory, debug output, or a later side channel) can recover the instance state and predict or forge all subsequent tokens. The transport auth gate (AuthError Invalid/Replay/Stale) then becomes cosmetic: an attacker can authenticate as any future client.","fix":"Replace FNV derivation with an OS CSPRNG (getrandom/OsRng, or BCryptGenRandom on Windows). Keep the 43-char one-time token wire format (prefix + 32 hex) and keep replay/stale enforcement. Pure-std FNV is acceptable only for the loopback PoC, not for the real broker RPC boundary.","ref":"https://learn.microsoft.com/en-us/windows/win32/api/bcrypt/nf-bcrypt-bcryptgenrandom"}
  - {"id":"FH-2","severity":"high","must_fix":true,"file":"crates/local-transport/src/server.rs","lines":"188-202, 295-323, 370-371, 419-438, 462-519","title":"Unbounded credential registry, unbounded per-connection queues and thread-per-rejected-connection enable local memory/thread exhaustion","attack":"Every issued token is inserted into the credentials map and never removed (used=true entries and expired entries are retained unless a stale token happens to be presented). Per-connection read_tx and write_rx are unbounded mpsc::channel() so a non-draining peer accumulates frames indefinitely, and every connection rejected by the concurrency cap spawns its own thread (reject_busy). Any local process can scan 127.0.0.1 for the server port and flood it, exhausting memory/threads and denying IPC to the Desktop host and plugins.","fix":"Add TTL-based purge (lazy sweep on issue + periodic timer), bound read/write queues (sync_channel + drop-oldest or backpressure), and stop spawning a thread per busy rejection (write the busy reply inline or via a small shared pool). Consider a handshake-attempt rate limit.","ref":"https://rustsec.org/advisories/"}
  - {"id":"FM-1","severity":"medium","must_fix":true,"file":"apps/desktop/src-tauri/src/managed_runtime.rs","lines":"615-640, 642-658","title":"Readiness verification is TCP-connect only — bootstrap token URL can be delivered to a non-DSH loopback service","attack":"After the child announces a candidate, the supervisor publishes the binding (and later the WebView navigates with ?token=... in the URL) on the strength of a bare TCP connect success. A local process that claims the port first (fixed-port squatting before the child binds, or a race after the child's listener closes while the child is still alive) will pass the check; the DSH session token then travels to the attacker's loopback server in the WebView navigation.","fix":"Before publishing, perform an HTTP-level identity check: inject a supervisor-chosen nonce (env/args) into the child, require it to be echoed in the marker or in the HTTP response of GET /, and fail closed otherwise. Long term, prefer a shell-minted single-use token over trusting the child-printed token.","ref":"https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/security"}
  - {"id":"FM-2","severity":"medium","must_fix":false,"file":"apps/desktop/src-tauri/src/managed_runtime.rs","lines":"757-795","title":"Supervisor policy flags are appended before user harnessArgs — semantic inverses can override loopback/no-open policy","attack":"build_launch_spec emits --host/--port/--no-open BEFORE environment.harness_args. validate_environment_value rejects exact reserved tokens (--host, --port, --no-open, --trusted-host and --x= forms) but not semantic inverses such as --open or future/alias flag spellings; with last-wins CLI parsing a crafted persisted catalog entry could make the child bind beyond loopback or open the browser. Mitigation exists (launch re-validates the catalog), but the ordering is fragile.","fix":"Append the Supervisor-owned policy arguments AFTER harnessArgs (they must be last), extend the reserved list with semantic inverses (--open, -o, --host=, --port=, --trusted-host), and assert argument order in build_launch_spec.","ref":"https://v2.tauri.app/security/"}
  - {"id":"FM-3","severity":"medium","must_fix":false,"file":"apps/desktop/src-tauri/src/commands.rs","lines":"490-515, 656-678, 778-813","title":"Runtime-touching commands block the Tauri main thread / tokio workers for up to ~10.5 s","attack":"get_managed_runtime_status, get_shell_snapshot and get_diagnostics are synchronous commands: get_managed_runtime_status can sleep 500 ms and spawn+wait a process for up to START_TIMEOUT (10 s) during auto-restart, freezing the UI/WebView2 message pump on every snapshot. Async surface commands (mount/status/layout/reload) call verified_surface_binding which can block a tokio worker up to ~10.5 s instead of using spawn_blocking (start/stop/restart already do).","fix":"Route every runtime-touching command through async + spawn_blocking with a bounded await; keep pure-state reads cheap (no process spawn inside status).","ref":"https://v2.tauri.app/security/"}
  - {"id":"FM-4","severity":"medium","must_fix":true,"file":"apps/desktop/src-tauri/src/managed_runtime.rs","lines":"320-341","title":"get_managed_runtime_status does not cross-check the requested environment against the running supervisor","attack":"Querying status for environment B while A is running returns A's state/generation/endpoint labeled with B's id. Worse: if A is crashed with auto_restart_on_crash, a status poll for B auto-restarts a new generation from A's retained recipe but labels it as B, so the UI can believe B is running when A was actually relaunched (wrong environment started, wrong surface binding for B).","fix":"Require supervisor.environment_id == environment.id() (return Conflict otherwise) before reporting or auto-restarting; add a regression test for foreign-environment status.","ref":""}
  - {"id":"FM-5","severity":"medium","must_fix":false,"file":"apps/desktop/src-tauri/src/managed_runtime.rs","lines":"525-542","title":"Restart swallows old-tree stop failures and can race two generations for the same port","attack":"restart_managed_environment ignores process.stop() errors (let _ =) and spawns the next generation after only a 1 s endpoint-release wait. If the old tree survives (stop failed), the new child may fail to bind or readiness may 'verify' against the old server, publishing a binding for the stale generation.","fix":"Treat stop failure as StopFailed and abort the restart (the Drop/Job-Object backstop still terminates the old tree); require the old process to be gone and the endpoint released before spawning; verify the endpoint belongs to the new generation (see FM-1 nonce).","ref":""}
  - {"id":"FM-6","severity":"medium","must_fix":false,"file":"apps/desktop/src-tauri/src/managed_runtime.rs","lines":"464, 851-863","title":"endpoint_is_released is TCP-connect based — TOCTOU and false positives from port reuse","attack":"Stop confirmation and restart sequencing both rely on TCP connect failing within 1 s. Another service binding the freed port yields a permanent EndpointStillReachable false positive even though the owned tree is dead, and the check races port reuse between check and the subsequent WebView navigation.","fix":"Base release confirmation on the owned process tree (Job Object termination + wait) instead of TCP connect; keep the connect check only as best-effort evidence.","ref":""}
  - {"id":"FM-7","severity":"medium","must_fix":false,"file":"apps/desktop/src-tauri/src/dsh_surface.rs","lines":"488-513, 583-593","title":"Child surface webview shares the default WebView2 profile/data directory with the trusted Shell webview","attack":"The dsh-surface child is created without a dedicated data directory, so it shares the default WebView2 environment/profile with the Shell webview: shared disk cache (remote DSH page content cached into the app's WebView2 folder), shared TLS state, and shared profile settings (SetIsPasswordAutosaveEnabled/SetIsGeneralAutofillEnabled(false) mutate the profile used by the Shell too).","fix":"Create the surface with its own user-data folder (WebviewBuilder data_directory) or a dedicated WebView2 environment so DSH content state is isolated from the Shell; keep the deny hooks.","ref":"https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/security"}
  - {"id":"FM-8","severity":"medium","must_fix":false,"file":"apps/desktop/src-tauri/src/managed_runtime.rs","lines":"300-318, 928-947","title":"Explicit start resets the recovery budget — crash-looping child can be respawned without limit","attack":"start_managed_environment sets recovery = None, so each explicit start (or restart) resets crash_count; a child that crash-loops can be re-spawned an unbounded number of times via repeated commands, each spawn holding a process tree, reader threads and a Job Object for up to START_TIMEOUT.","fix":"Keep recovery state across explicit starts; clear it only after successful readiness or an explicit user reset.","ref":""}
  - {"id":"FL-1","severity":"low","must_fix":false,"file":"apps/desktop/src-tauri/src/managed_runtime.rs","lines":"1039-1064, 1168-1199","title":"Child executes between spawn() and AssignProcessToJobObject","attack":"A fast-spawning child could create descendants before job assignment, letting them escape KILL_ON_JOB_CLOSE tree cleanup (orphan processes after stop). Window is microseconds, but a malicious recipe can exploit it.","fix":"Spawn suspended (CREATE_SUSPENDED), assign to the Job Object, then resume.","ref":""}
  - {"id":"FL-2","severity":"low","must_fix":false,"file":"apps/desktop/src-tauri/src/managed_runtime.rs","lines":"1201-1205","title":"Windows stop is always forced (TerminateJobObject) — graceful stop never achieved","attack":"ProcessTree::stop on Windows only force-terminates, so stop_disposition always reports 'forced' and the child gets no chance to shut down cleanly (no WM_CLOSE/console-ctrl path). Not a confidentiality issue, but misleads lifecycle reporting and can lose child state.","fix":"Attempt a graceful path first (documented DSH shutdown endpoint or ctrl-event), then terminate after STOP_TIMEOUT.","ref":""}
  - {"id":"FL-3","severity":"low","must_fix":false,"file":"apps/desktop/src-tauri/src/managed_runtime.rs","lines":"1223-1256","title":"Unix process-group cleanup misses setsid()-escaping descendants","attack":"kill(-pgid) cannot reach descendants that created their own session/group; they survive stop as orphans. Unix target is currently unsupported_platform, so this is deferred.","fix":"When Unix is enabled, use a cgroup/subreaper or walk /proc descendants before signalling.","ref":""}
  - {"id":"FL-4","severity":"low","must_fix":false,"file":"apps/desktop/src-tauri/src/environment_store.rs","lines":"142-186, 203-206, 215-218","title":"Catalog write path has no Windows ACL, is vulnerable to sidecar junction redirection and has a remove+rename crash window","attack":"restrict_directory/restrict_file are no-ops on Windows; the .next sidecar is opened with create+truncate (a pre-planted junction/symlink at the sidecar name redirects the truncating write to an arbitrary file), and fs::remove_file(path) before rename leaves a window where a crash loses the catalog (backup exists but is never auto-restored on load).","fix":"Set an explicit user-only DACL on the catalog directory, verify the sidecar is a regular file before opening (or open with no-follow semantics), and restore from .bak on load when the main file is missing.","ref":""}
  - {"id":"FL-5","severity":"low","must_fix":false,"file":"crates/supervisor/src/broker.rs","lines":"509-556","title":"Lease revocation is lease-granular — overlapping leases undermine revocation; expired leases are never evicted","attack":"enforce_valid_lease allows dispatch if ANY covering lease is valid; revoking lease A does not block dispatch when lease B (same capability/owner/generation, overlapping scope) still covers, so a revocation intended to cut off an owner can be bypassed with a second lease. Expired leases also accumulate in the map (memory growth).","fix":"On revoke, revoke all covering leases for (capability, owner, generation) or make revocation capability/owner-wide; purge expired leases periodically.","ref":""}
  - {"id":"FL-6","severity":"low","must_fix":false,"file":"crates/local-transport/src/framing.rs","lines":"44-49","title":"encode_frame silently truncates the length prefix above 4 GiB","attack":"payload.len() as u32 wraps silently for >4 GiB payloads, desynchronizing the stream. Memory-bound today, but the unchecked variant is a footgun.","fix":"Use encode_frame_checked everywhere or debug_assert the length fits u32.","ref":""}
  - {"id":"FL-7","severity":"low","must_fix":false,"file":"apps/desktop/src-tauri/src/managed_runtime.rs","lines":"587-613","title":"First candidate line is authoritative — a malformed marker aborts start even if a valid one follows","attack":"stdout and stderr feed one channel from two threads; if the first marker-like line is invalid (e.g. 'dsh web: http://localhost:4317/'), parse_candidate fails and start aborts with CandidateInvalid even though a valid line arrives later (fail-closed, but brittle).","fix":"Scan up to N candidates within the readiness window and accept the first valid one; treat only 'no valid candidate in window' as failure.","ref":""}
  - {"id":"FL-8","severity":"low","must_fix":false,"file":"apps/desktop/src-tauri/src/dsh_surface.rs","lines":"831-853","title":"force_unmount closes the surface webview unconditionally, even for another generation","attack":"A concurrent mount of generation N+1 racing stop of generation N can have its fresh webview closed by the stale force_unmount (record update is gated, the close is not).","fix":"Only close the webview when the current record's generation matches the requested one.","ref":""}
  - {"id":"FL-9","severity":"low","must_fix":false,"file":"apps/desktop/src-tauri/src/managed_runtime.rs","lines":"272, 652","title":"Token-bearing bootstrap URL stays in supervisor memory for the run lifetime","attack":"The Url with ?token=... is stored in Supervisor.bootstrap_url and cleared on stop, but heap bytes are not zeroized; a memory dump of a healthy session exposes the token. Standard desktop trade-off, but worth a zeroize pass.","fix":"Consider zeroizing the URL string buffer after the surface consumes the binding (best-effort; secrets in WebView2 memory cannot be fully controlled anyway).","ref":""}
  - {"id":"FL-10","severity":"low","must_fix":false,"file":"apps/desktop/src-tauri/src/diagnostics.rs","lines":"200-203","title":"Diagnostics whitelist round-trip panics if the public report diverges","attack":"serde_json::to_value(...).expect() panics when a future ManagedRuntimeReport field type breaks the whitelist view — the panic runs on the IPC main thread (diagnostics is a sync command), taking down the app instead of failing closed.","fix":"Map the round-trip to DiagnosticsError::StateUnavailable instead of expect().","ref":""}
  - {"id":"FI-1","severity":"info","must_fix":false,"file":"Cargo.lock","lines":"workspace","title":"cargo audit: 0 vulnerabilities; 9 warnings, all transitive","attack":"8 unmaintained crates (proc-macro-error 1.0.4; unic-char-property/range/common, unic-ucd-ident/version 0.9.0 via urlpattern -> tauri-utils) and 1 unsound (glib 0.18.5 RUSTSEC-2024-0429, Linux-only via wry/gtk, not compiled on the Windows target). tauri pinned =2.11.5 is above the GHSA-57fm-592m-34r7 (CVE-2024-35222 iframe IPC bypass) fix (>=2.0.0-beta.20).","fix":"No action for Windows builds; re-run cargo audit before the Linux/macOS milestone and track upstream updates for the unmaintained build-time crates.","ref":"https://rustsec.org/advisories/, https://github.com/tauri-apps/tauri/security/advisories/GHSA-57fm-592m-34r7"}
  - {"id":"FI-2","severity":"info","must_fix":false,"file":"crates/local-transport/src/","lines":"design","title":"Loopback transport is unencrypted plaintext (by design, PoC)","attack":"The token is the only gate; a same-user process with packet capture privileges could read frames. Accepted for the loopback PoC (AGENTS.md: local-only, replay/stale/oversize protection; token does not prove single-plugin identity).","fix":"Track a future carrier with OS ACLs (named pipe / UDS with peer identity) and/or TLS.","ref":""}
  - {"id":"FI-3","severity":"info","must_fix":false,"file":"apps/desktop/src-tauri/tauri.conf.json","lines":"9, 25-28","title":"Dev-mode origin http://localhost:1420 is inside the shell capability; bundle.active is false","attack":"In dev, any script served by the dev server runs in the 'shell' webview and can invoke all 18 commands; packaged builds have no bundle config yet. Standard dev trade-off; the production frontendDist build keeps CSP default-src 'self' and no dangerousRemoteDomainIpcAccess.","fix":"Ensure release builds ship with the built frontend and re-verify ACL after bundling is enabled.","ref":"https://v2.tauri.app/security/"}
  - {"id":"FI-4","severity":"info","must_fix":false,"file":"apps/desktop/src-tauri/src/commands.rs","lines":"475-481","title":"Correlation IDs are predictable (pid + atomic sequence)","attack":"Not a secret; suitable for correlation only. No action.","fix":"","ref":""}
