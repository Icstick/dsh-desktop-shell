  - {"id":"D-03","group":"duplication","location":"managed_runtime.rs:232-237/883-889, diagnostics.rs:95-101/314-320, attached_health.rs:68-73, discovery.rs:69-74/246-256","priority":"medium","issue":"四个模块各自定义 {code, severity, message} evidence 结构 + 相同构造器，序列化形状完全一致（camelCase 或单词字段无差异）。","suggestion":"定义共享 pub(crate) struct Evidence { code: &'static str, severity: &'static str, message: &'static str }（+ new()），各模块 report 复用同一类型；诊断/健康/发现/运行时 evidence 字段名与序列化保持不变。"}
  - {"id":"D-04","group":"duplication","location":"Rust：managed_runtime.rs:27-99, dsh_surface.rs:33-75, dsh_surface_policy.rs:11-26, attached_health.rs:11-16, diagnostics.rs:26-31；TS：apps/desktop/src/contracts.ts:120-123, 150-170, 209-212, 258-261, 336-346","priority":"medium","issue":"跨模块 8 个 Rust 请求结构（2 种形状）与约 10 个 TS 请求接口（3 种形状）各自重复 schemaVersion/environmentId[+expectedGeneration] 样板；TS 侧已用 extends（342-346），Rust 侧没有对应机制。","suggestion":"与 S-05/S-06 联动：Rust 用共享字段/宏收敛；TS 侧把 {schemaVersion, environmentId} 提为 EnvironmentRequest 基接口、带 generation 的提为 GenerationRequest 基接口，统一 extends。"}
  - {"id":"D-05","group":"duplication","location":"apps/desktop/features/environment-settings/src/environment-draft.ts:3-4, 68-99 与 apps/desktop/src-tauri/src/commands.rs:28, 963-977","priority":"high","issue":"前后端各持一份环境校验规则：id 正则、label 长度、args<=64、reserved arguments 清单（--host/--port/--no-open/--trusted-host）、端口范围。双份是刻意的（前端 UX 预校验 + 后端权威校验），但文案已开始漂移（如端口错误消息两处措辞不同），未来规则变更极易只改一端。","suggestion":"以 spec 为单源（如 specs/config/dsh-environment.schema.json 的 pattern/min/max 已是半单源）：前端从 spec 生成校验常量（或复制时带引用注释 + 指向 spec 行号），并加一条「前端规则与后端命令集一致性」的防漂移测试（例如断言两个 reserved 清单相等、端口边界相同）。后端仍是唯一权威，前端校验失败不替代后端。属「该保留的冗余」，重点是防漂移。"}
  - {"id":"K-01","group":"dead-code","location":"apps/desktop/src-tauri/src/commands.rs:1024-1027","priority":"high","issue":"let _policy_is_present = environment.policy.as_ref().map(|policy| (policy.auto_restart_on_crash, policy.allow_native_adapter)); 是纯死表达式：结果从未被读取，仅为了「触碰」字段。","suggestion":"直接删除该三行；若 intent 是记录 policy 进入 launch preview，则真正接入 preview 字段或写注释说明为何不展示。"}
  - {"id":"K-02","group":"dead-code","location":"apps/desktop/src-tauri/src/commands.rs:99 与 1027（联动 M-01）","priority":"medium","issue":"EnvironmentPolicy::allow_native_adapter 字段在 Rust 后端除 K-01 的死表达式外无任何消费者（build_launch_spec、policy、diagnostics 都不读它），仅随 schema 往返序列化。","suggestion":"在 enforcement 落地前：删除死表达式（K-01）后，要么把该字段标记为 reserved（注释 + schema description），要么在 adapter/capability gate 落地时再启用；避免「接受但永不执行」的授权旋钮（见 M-01）。"}
  - {"id":"K-03","group":"dead-code","location":"apps/desktop/src-tauri/src/dsh_surface.rs:279-305, 341 与 specs/webview/dsh-surface-status.schema.json:33","priority":"low","issue":"DshSurfaceStatus.policy 恒为 SurfacePolicy::default()（固定 deny 常量），运行时从不变化——属于「冗余字段」：每次 report 都重建同一对象。","suggestion":"因 schema 强制 policy 字段存在，保留序列化，但可在 report() 中用 once_cell/const 常量（或直接内联字段）并加注释「固定策略，防未来误开放」；等 schema v2 再评估移除。"}
  - {"id":"M-01","group":"missing-redundancy","location":"apps/desktop/src-tauri/src/commands.rs:99 + apps/desktop/features/environment-settings/src/EnvironmentSetup.tsx:241-248","priority":"high","issue":"UI 暴露「Allow negotiated native adapter」开关、schema 接受 allowNativeAdapter，但后端任何路径都不执行该授权（无 adapter gate、无 policy 消费、无 launch 影响）。用户会误以为已授权；若未来某处开始消费而校验缺失，即成为 fail-open。","suggestion":"fail-closed 修正：在 capability adapter gate（ADR-0014 之后的 capability 层）落地前，隐藏该开关/将字段标为 reserved 并拒绝非默认值（validate_environment_value 加规则：allowNativeAdapter=true 报 UNAUTHORIZED），或至少在后端加显式未启用检查。理由：未强制执行的授权声明是安全冗余缺口。"}
  - {"id":"M-02","group":"missing-redundancy","location":"apps/desktop/src-tauri/src/commands.rs:491-515 (get_shell_snapshot), 779-794 (get_managed_runtime_status), 797-813 (get_diagnostics)；阻塞链 apps/desktop/src-tauri/src/managed_runtime.rs:335-337, 612, 639","priority":"high","issue":"这三个是同步 tauri 命令（主线程执行），但 get_managed_runtime_status 在 auto_restart_eligible 时可能 thread::sleep(500ms) 后进入 start_with_spec，其就绪轮询最长 START_TIMEOUT=10s（每轮 sleep 20-40ms + TCP connect_timeout 250ms）；get_shell_snapshot/get_diagnostics 同样经由此路径。一次状态轮询可冻结 UI 数秒。","suggestion":"把 get_managed_runtime_status / get_shell_snapshot / get_diagnostics 改为 async + tauri::async_runtime::spawn_blocking（与 start/stop/restart/probe 一致），或将 auto-restart 从 status 读路径移到显式命令/后台任务。理由：与已 spawn_blocking 的四个命令形成对称的边界防护，防止主线程长阻塞。"}
  - {"id":"M-03","group":"missing-redundancy","location":"apps/desktop/src-tauri/src/commands.rs:631-653 与 835-841","priority":"medium","issue":"stop_managed_environment 命令先 dsh_surface::force_unmount 再停运行时（正确的清理顺序），但 restart_managed_environment 命令没有对应 unmount：restart 期间旧 generation 的 WebView 仍挂载，直到前端 reconcile 轮询发现 binding 变化才清理，存在 stale binding 的可见窗口。","suggestion":"restart 命令在 spawn_blocking 前同样调用 force_unmount(当前 environment_id + expected_generation)（失败可忽略或映射），保证任何生成变更路径都有 surface 清理冗余；补充一条命令层测试断言 restart 后 surface 已 unmounted。理由：两条 mutation 路径应共享同一条冗余清理链。"}
  - {"id":"M-04","group":"missing-redundancy","location":"apps/desktop/src-tauri/src/dsh_surface.rs:525-534","priority":"medium","issue":"mount_windows_surface 中 webview.hide() 失败路径只调 surface_operation_failed（写 Error 记录）但未关闭刚创建的 child WebView；而 add_child 与 navigate 失败路径都会 close。hide 失败后 webview 仍存活且可见，直到下次 mount 才被 close_existing 收掉。","suggestion":"在 hide() 的 map_err 分支中补 let _ = webview.close();（与 543/554 行一致），使三条失败路径都有完整清理。理由：冗余清理路径（显式 close + 状态记录）在其他分支已有，此分支缺失。"}
  - {"id":"M-05","group":"missing-redundancy","location":"apps/desktop/src-tauri/src/commands.rs:822-827 与 636-638；兜底 managed_runtime.rs:508","priority":"low","issue":"stop 命令在 IPC 层额外预检 expected_generation()==0（与运行时层重复，属好冗余），restart 命令没有同样预检（仅运行时层返回 StaleGeneration）。边界校验不对称。","suggestion":"restart 命令补同样的 expected_generation()==0 预检（返回 MALFORMED_MESSAGE），使所有 generation 参数命令在边界层 fail-fast 一致；运行时层校验保留作为兜底。理由：双重校验只在所有入口对称时才可靠。"}
  - {"id":"M-06","group":"missing-redundancy","location":"apps/desktop/features/environment-settings/src/environment-draft.ts:68-99 与 apps/desktop/src-tauri/src/commands.rs:857-977","priority":"medium","issue":"前端预校验与后端权威校验双份（见 D-05），已出现措辞漂移且无任何机制保证两套规则一致；后端某天收紧（如 args 上限 32）时前端仍放行，直到 save 才报错。","suggestion":"加一条防漂移测试：用同一批边界样例（合法/非法 id、端口 1023/1024/65535/65536、reserved args）断言前端 convertEnvironmentDraft 与后端 validate_environment_value 结论一致；并在两端常量处加指向 spec 的注释。理由：跨边界重复校验需要「校验校验者」的冗余。"}
  - {"id":"M-07","group":"missing-redundancy","location":"crates/local-transport/src/server.rs:217-223","priority":"low","issue":"LocalServer::stop() 只停 accept 循环并 join，已建立连接不通知关闭，只能靠 read/write deadline（默认 30s）自然超时；服务端 teardown 不确定。","suggestion":"在 ServerState 增加 shutdown 标记并让 worker_loop 轮询该标记（或向 conns 广播关闭），使 stop() 后连接在下一 poll 周期（20ms）内退出；保持 drop 幂等。理由：Drop + 显式 stop 的双路径已有，但 stop 对既有连接缺一条确定性清理路径。"}
  - {"id":"M-08","group":"missing-redundancy","location":"crates/supervisor/src/broker.rs:370-395 (lease) 与 422-443 (enforce_dispatch)；apps/desktop/src-tauri/src/commands.rs:527-557 与 dsh_surface_policy.rs:158-161；dsh_surface.rs:426","priority":"medium","issue":"若干「有意冗余」缺少显式标注，未来重构可能被当作普通重复删掉：lease() 签发期校验与 enforce_dispatch() 派发期校验（owner/generation/scope）双份；命令层 schema_version/id 校验与域层再校验双份；dsh_surface mount 的 expected_generation 与 binding 再核对双份。这些正是 defense-in-depth 的核心。","suggestion":"在双检点加注释（如 // Intentional dual check: issue-time + dispatch-time, see AC-LEASE-001）或统一引用 ADR-0014 的固定校验顺序；为 broker 加一条「绕过 lease() 直接构造状态无法绕过 enforce_dispatch」的回归测试。理由：把必要冗余显式化为契约，防止未来的「精简」误删安全边界。"}
