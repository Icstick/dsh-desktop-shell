branch_or_worktree: "feat/m12-peer-identity (cherry-picked as a78db59; that branch is not yet on main)"
claim_expires_at: null
dependencies: []
acceptance_criteria:
  - "A caller that times out hands its pending entry back: the client sends `ClientCommand::Abandon { id }` naming the invocation it queued. Asserted by test."
  - "The worker drops the entry on that command (`pending.remove(&id)`); the arm is enforced by the exhaustive match on the two-variant command enum, and a late reply for the reaped id then finds nothing and is dropped by the existing `if let Some(reply) = pending.remove(&id)`. Not asserted end-to-end: driving `worker_loop` needs a live `LocalClient`, which the in-flight ADR-0022 carrier refactor owns."
  - "[revised 2026-09-12, with evidence] No tombstone. Message ids come from `unique_token` (nanosecond stamp + per-process atomic counter, crates/daemon/src/envelope.rs:724-733), so an id cannot be reused inside a process; a tombstone would be machinery with no failure mode left to prevent. Criterion withdrawn rather than implemented."
  - "No behaviour change while no timeout occurs: the invoke happy path, the reconnect-and-retry path, and the event bridge keep their existing tests green."
security_impact: "None at the trust boundary. This is Shell-side bookkeeping for its own invocations; the reply-matching rule (deliver only to the id the daemon echoes) is untouched, and the abandon only removes an entry whose caller already stopped listening."
compatibility_impact: "No protocol, envelope or capability change; internal to apps/desktop/src-tauri/src/daemon_client.rs."
scope:
  - apps/desktop/src-tauri/src/daemon_client.rs (ClientCommand, DaemonClient::invoke timeout arm, worker_loop drain)
evidence:
  - "cargo test -p dsh-desktop-shell --lib => 172 passed; 0 failed (includes the new daemon_client::tests::a_timed_out_invocation_is_abandoned_to_the_worker)."
  - "cargo clippy -p dsh-desktop-shell --all-targets -- -D warnings => clean. The first run caught clippy::large_enum_variant on the new second variant; fixed by boxing the envelope rather than allowing the lint."
  - "On feat/m12-peer-identity after the cherry-pick: cargo test -p dsh-desktop-shell --lib => 172 passed; 0 failed; cargo clippy -p dsh-desktop-shell --all-targets -- -D warnings => clean."
  - "cargo fmt --check on the changed file => clean. NOTE: rustfmt also rewrote four committed files under crates/local-transport/ on this toolchain (rustc 1.98); those edits were reverted, so the branch touches only daemon_client.rs + this WI + the handoff."
