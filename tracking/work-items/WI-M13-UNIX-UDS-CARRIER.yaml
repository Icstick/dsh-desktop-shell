acceptance_criteria:
  - "UdsListener/UdsStream carrier in dsh-local-transport (Unix), with peer identity via SO_PEERCRED (Linux) and LOCAL_PEERPID or getpeereid (macOS); the non-Linux path currently returns a typed Unsupported error and must become a real implementation or an explicit documented degradation."
  - "Daemon attaches the UDS carrier on Unix; the credential file publishes the socket path; the Shell prefers it over TCP."
  - "Unix default policy returns to strict once the carrier lands (remove the platform gate in main.rs)."
  - "CI matrix (ubuntu + macos) green including the carrier tests; the same-user impostor negative test runs on Unix."
  - "scripts/qa/live-daemon-qa.mjs gains a peer-identity-carrier leg (connect over the pipe/UDS, assert control-plane authority)."
  - "H-2 closure recorded where this repository can hold it: ADR-0022 records decision 4 as satisfied (CI run id as evidence) and docs/security/IPC_SECURITY.md states the control-plane identity requirement. NOTE 2026-09-13: the audit summary ADR-0021/0022 cite (docs/audits/audit-summary-2026-09-10.md) is NOT in this repository - it is an external reference and cannot be edited here, so the closure lives in the two in-repo documents."
security_impact: "Extends the H-2 fix to Unix platforms with the same fail-closed semantics; no new trust boundary beyond the carrier."
compatibility_impact: "New carrier; credential file v3 adds an optional socketPath next to the v2 pipeName (the daemon attaches exactly one carrier, so a file never carries both); TCP remains the documented degradation."
scope:
  - crates/local-transport/ (uds carrier)
  - crates/daemon/ (carrier attach + platform policy gate removal)
  - apps/desktop/src-tauri/src/daemon_client.rs (carrier preference)
  - scripts/qa/ + CI matrix
  - tracking/ + docs/audits
evidence:
  - "UDS carrier (crates/local-transport/src/uds.rs): UdsListener bind/accept/peer_identity over UnixStream - no acceptor thread needed because UnixListener honours non-blocking accept; socket 0600, a parent directory it creates 0700 (an existing one is left alone); stale socket replaced but a real file at that path never deleted; path-length guard for sockaddr_un. Six tests: round trip with kernel pid + resolved image path, read deadline as WouldBlock, peer close surfaces as EOF (parity with the named pipe regression), stale-socket replacement, owner-only modes, overlong path."
  - "macOS peer identity (crates/local-transport/src/peer.rs): getsockopt(LOCAL_PEERPID) + proc_pidpath behind the crate's second documented unsafe exemption (Linux stays unsafe-free through nix SO_PEERCRED + /proc); other Unix keeps a typed Unsupported error and therefore fails closed. image_matches now folds case only on Windows and macOS (case-preserving filesystems elsewhere)."
  - "Daemon (crates/daemon/src/server.rs, main.rs, credential.rs): CarrierEndpoint (NamedPipe | UnixSocket) replaces the pipe-only field; credential schema v3 publishes pipeName or socketPath; the Unix carrier binds in the data directory with a per-process nonce; the Unix policy gate is gone so strict is the default on every platform; a strict policy with no carrier attached now warns explicitly."
  - "Shell (apps/desktop/src-tauri/src/daemon_client.rs): ClientStream::UnixSocket + connect_carrier prefers the published socket on Unix (named pipe on Windows) and falls back to identity-less TCP with a logged reason."
  - "Tests: crates/daemon/tests/peer_identity_pipe.rs became the platform-generic peer_identity_carrier.rs - positive leg (matching image keeps ShellControl and dispatch succeeds) and the H-2 impostor leg (same user, valid credential, Shell claim, different image -> no grant, Unauthorized) now run on all three CI platforms; tests/common gains carrier-generic connect helpers."
  - "Live QA (scripts/qa/live-daemon-qa.mjs): A3 upgraded to credential v3 + carrier endpoint; new A3b (a connection over the carrier reports the kernel identity of the connecting process, asserted from the daemon audit log) and A3c (the same process claiming the Shell from a non-Shell image is degraded - authority=Participant, no grant, Unauthorized dispatch). A4/B4 share a fresh-credential retry helper because the carrier leg consumes the one-time file token."
  - "Local evidence 2026-09-13: Linux crate suite green in WSL Ubuntu26 (rustc 1.98.0) - all six UDS tests pass together with the existing suite; clippy -D warnings clean on Linux; Windows clippy clean with daemon/desktop suites green."
  - "Bug found by the Linux run (fixed): UdsListener::bind re-moded an existing parent directory, which fails with EPERM on /tmp and would quietly wreck a shared directory when run as root. It now only creates + restricts a directory it creates; regression test an_existing_parent_directory_is_left_alone."
  - "Bug found by the positive carrier leg (fixed): canonicalizing the expected Shell path returns the Windows verbatim \\\\?\\\\-prefixed form, which no kernel API reports - under the strict policy every real Shell claim would have been refused while the impostor leg still passed. The daemon and the test now use the literal kernel-form path; the reasoning is documented at both sites."
