acceptance_criteria:
  - "File tree + text view with lightweight edit/save over environment-linked roots (env repo path, dshHome, plugin dirs)."
  - "Human-only surface; every new command registered in the ACL manifest/capability; no agent bridge."
  - "Typecheck, tests, build; visual acceptance with the user."
security_impact: "Reads and writes files on the user's machine under human UI actions only; commands gated by the existing Shell capability."
compatibility_impact: "New Tauri commands + contracts; no existing behavior changes."
scope:
  - apps/desktop/features/file-manager-ui/ (new)
  - apps/desktop/src-tauri/ (fs commands)
  - specs/ (fs command schemas + fixtures)
  - apps/desktop/src/contracts.ts + i18n.tsx
  - tracking/
evidence:
  - "FS-M1 backend (apps/desktop/src-tauri/src/file_manager.rs): roots derived from the active environment (repo = harness repository path, dsh-home, harness-cwd), containment core = validate_relative (rejects `..`, absolute, drive-relative, UNC/device and over-long paths before any filesystem call) + join/canonicalize/prefix check on the canonical forms, symlinks reported as links and never followed for expansion, 2000-entry listing cap with an explicit truncated flag, 2 MiB edit cap and non-UTF-8 detection (both open read-only with a reason), UTF-8 BOM detection. Seven unit tests: the negative containment matrix, escape through a symlink into a sibling whose name shares the root prefix, listing order/hidden filter, file-vs-directory errors, encoding/truncation/read-only reporting, unknown roots, the closed root-id vocabulary."
  - "FS-M1 command surface: fs_list_roots / fs_read_dir / fs_read_file as Tauri commands (human-only, ACL-registered in all four places: build.rs COMMANDS, capabilities/shell.json permissions, lib.rs generate_handler, scripts/validate-acl.mjs). validate-acl.mjs passes with 43 commands. Containment failures map to MALFORMED_MESSAGE and missing paths to UNAVAILABLE; no absolute path ever crosses the boundary."
  - "Specs: specs/fs/ gains six schemas plus twelve fixtures (roots request/report, read-dir request/report, read-file request/report); scripts/validate-specs.mjs reports 69 schemas, 145 fixtures, ALL PASS."
  - "FS-M1 frontend (apps/desktop/features/file-manager-ui/): lazy tree per root, hidden-entry toggle, read-only text view with size/encoding header and an explicit read-only banner, keyboard-reachable rows, explicit unavailable-root state carrying the reason, containment failures surfaced as an alert. Wired as the workbench surface (ActivityRail entry + artwork + ShellApp). contracts.ts / desktop-api.ts / i18n (zh+en) extended; the four existing DesktopApi test doubles were extended too."
  - "Gates 2026-09-13: cargo fmt clean; cargo clippy -p dsh-desktop-shell --all-targets -D warnings clean; cargo test -p dsh-desktop-shell green (unit 180 incl. the 7 file-manager tests; integration suites green); pnpm check clean; pnpm test 8 files / 115 tests green (3 new panel tests); validate-acl 43 commands; validate-specs 69/145 ALL PASS."
  - "Deviation from the design doc, recorded on purpose: the plugin directories are not a separate root - they live inside the DSH home (profiles/*/node_modules), which the dsh-home root already covers; a layout-derived extra root would encode a DSH-layout assumption this module does not own. FS-M2 can add one with the layout pinned."
  - "CI (PR #4, run 34729881676): ubuntu + macos + windows test jobs and live-qa-windows all success at head 9532450; squash-merged to main as 1b293fa (2026-09-13), branch deleted. The work item stays in review because the design doc gates the slice on the user's visual acceptance (keyboard walkthrough, empty/degraded/error states, read-only banner)."
