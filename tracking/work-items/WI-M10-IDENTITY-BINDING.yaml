acceptance_criteria:
  - "ADR-0021 lands as `proposed` with the three alternatives, a single explicit recommendation and the honest limitation (option C alone does not close the same-user case)."
  - "The daemon records an explicit per-activation authority class at Hello instead of re-comparing self-reported strings at dispatch time."
  - "A negative test proves a non-Shell identity never keeps the broker-relaxed human path, and a second one proves one connection cannot mix identity classes."
  - "No wire-format, Schema or fixture change: the protocol version, specs and compatibility matrix stay untouched."
security_impact: "Narrows a trust-boundary defect (audit H-2): the broker-relaxed human path is decided by a server-computed authority class instead of a self-reported string comparison, and identity mixing on one connection is rejected. It does NOT close H-2 — a same-user process holding the credential can still claim the Shell identity; the ADR states this explicitly and registers the OS-level peer-identity follow-up (ADR-0022 candidate)."
compatibility_impact: "None intended: envelope/Schema/fixtures unchanged. Behavior change is limited to activations that would previously have been accepted while mixing identity classes on one connection (now UNAUTHORIZED)."
