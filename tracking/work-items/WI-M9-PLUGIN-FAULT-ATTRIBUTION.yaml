dependencies: []
acceptance_criteria:
  - "Given a failed start or broken profile, the tool resolves ownership along profile manifest -> lockfile -> bundles -> loader entry ids -> slot conflicts -> dependencies -> Cordis patch rows and emits a structured verdict."
  - "Output names the responsible plugin/entry when evidence is sufficient, and reports unknown with the exact unresolved link when it is not (INVARIANTS #15: no guessed success)."
  - "Read-only: no profile mutation, no plugin install/remove, no network."
  - "Verdict is reproducible from a saved evidence bundle."
security_impact: "Reads profile metadata and logs; must not copy credentials, tokens, or raw session content into the verdict (INVARIANTS #14)."
compatibility_impact: "New diagnostics capability with its own apiVersion + kind (INVARIANTS #7); no change to runtime control semantics."
scope:
  - crates/daemon/ (evidence collection)
  - crates/adapter-dsh/ (profile/loader/patch introspection)
  - specs/ (attribution report schema + fixtures)
  - apps/desktop/ (diagnostics view)
