acceptance_criteria:
  - "H-1: the daemon credential file is written 0600 and its data directory 0700 on Unix; the Unix data-directory resolution no longer degrades to the current working directory (XDG_DATA_HOME/HOME or a loud error)."
  - "H-3: the DSH Surface page_load diagnostic no longer writes the bootstrap URL (which carries the 43-char web token) to stderr."
  - "Medium: harness.path validation tightens the explicit trust boundary before Supervisor spawn (exists / is a file / normalized absolute path)."
  - "Medium: scripts/validate-specs.mjs turns unsupported-schema-keyword detection into a real exit-code failure."
  - "Medium: the terminal command family enforces its schema bounds (cols/rows/shell/cwd/data) in the Shell layer."
  - "Medium: tests/contract/ carries real contract tests for the terminal bounds and the protocol schemas, wired into pnpm test."
  - "cargo test --workspace --no-fail-fast, pnpm --dir apps/desktop test and node scripts/validate-specs.mjs stay green."
security_impact: "Closes two High findings (credential file permissions, token written to stderr) and tightens two trust boundaries (harness.path before Supervisor spawn, terminal request schema). No new trust boundary is introduced; the H-2 hello-identity finding is explicitly deferred to an ADR."
compatibility_impact: "Unix-only behavior change: the daemon data directory resolves via XDG_DATA_HOME/HOME/.local/share and fails loudly instead of falling back to the cwd. Terminal requests that already violated the published schema (cols/rows/shell/cwd/data bounds) are now rejected in the Shell instead of being forwarded to the daemon."
