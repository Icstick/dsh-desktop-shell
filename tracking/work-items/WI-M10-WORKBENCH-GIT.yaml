evidence:
  - "GIT-M1 backend (apps/desktop/src-tauri/src/git_panel.rs): read-only status / diff / log / branches over the environment-linked repository, driven by the git CLI through one helper that never uses a shell, pins GIT_OPTIONAL_LOCKS=0 (a read must not refresh or lock the index) and caps stdout at 512 KiB with a truncated flag. The repository is exactly the environment's harness repository path - a caller never supplies a root; a caller-supplied repo-relative path is validated with the file manager rules plus a git-specific one (a leading '-' is refused so a path can never become an option)."
  - "GIT-M1 backend tests (5, all green): status walks untracked -> staged -> clean -> modified in a real temporary git repo; diff covers the worktree and the index and narrows to one path; log and branches describe the repository; path validation refuses ../, absolute, drive, a leading dash and empty; a missing environment or a plain directory degrades with a typed UNAVAILABLE. One test caught a real gap: a repository with no commits reports '## No commits yet on <branch>', which the branch parser now handles (the design doc explicitly requires a no-commit repo to work)."
  - "Commands git_status / git_diff / git_log / git_branches registered in all four ACL places -> validate-acl 49 commands; specs/git adds 8 schemas + 16 fixtures -> validate-specs 81 schemas / 169 fixtures ALL PASS."
  - "Slice plan landed before the code: docs/roadmap/PLAN-GIT-M1.md (backend contract, frontend tab shape, tests, explicit deferrals); the 'As built' section records where the shipped frontend differs from the plan and why."
  - "GIT-M1 frontend (2026-09-13): features/workbench-ui/src/WorkbenchPanel.tsx is the Files | Git host - a roving-focus role=tablist (Arrow / Home / End move selection and focus) over one body, and only the active tab is mounted, so the file tree stops polling while Git is open. The active tab's subtitle now sits at the right edge of the strip and both panels dropped their in-panel heading, because the screenshots showed the page header and the panel body stacking '工作台 / 工作台' twice. features/git-panel-ui/src/GitPanel.tsx groups the status into Staged / Unstaged / Untracked with counts (a partially staged MM file is listed in both facets instead of being folded into one), carries the repository root + branch (or Detached HEAD) + read-only chip in the document bar, filters the loaded rows client-side with an N/M count, and shows the read-only diff pane plus the design doc's other read-only views (recent commits, branches with the current one marked) behind disclosures."
  - "GIT-M1 diff pane: the backend's unified text is rendered as inline spans with the literal newlines kept, so copying it out of the pane still yields real lines. +/- take --wb-diff-added / --wb-diff-removed with a color-mix tint derived from the same token (no second hardcoded colour) and @@ hunks take the accent. A 512 KiB diff can still be tens of thousands of lines, so rendering stops at 4000 lines and says so (git.diff.linesCapped) rather than quietly shortening the file; an untracked entry asks for no diff at all (git has none) and the pane says that."
  - "GIT-M1 states drawn explicitly: clean tree ('the working tree is clean'), filtered-empty ('no change matches the filter'), no diff for an untracked entry, a diff-request failure, and a repository-level failure that renders the backend message verbatim under 'Git is unavailable' (UNAVAILABLE) or 'the git panel failed' (anything else) in a role=alert."
  - "GIT-M1 frontend tests: vitest GitPanel 7/7 (facet counts + the exact git_diff request shape, a staged entry asks the index, clean state, UNAVAILABLE reason, untracked has no diff, filter narrows + reports the count, disclosures render the log and mark the current branch) and WorkbenchPanel 2/2 (Files is the default, the body swaps on tab click and no git command runs before the tab is opened, arrow keys move selection and focus). The four existing DesktopApi test doubles gained the four git stubs so the interface addition keeps the whole workspace type-checking."
  - "Gates 2026-09-13 (GIT-M1 frontend): pnpm check clean; pnpm test 10 files / 127 tests green (118 before); validate-acl 49 commands; validate-specs 81 schemas / 169 fixtures ALL PASS. No Rust file changed in the frontend commits - the backend half is green on CI run 34742913424 (ubuntu + macos + windows + live-qa-windows)."
  - "GIT-M1 visual evidence (2026-09-13, this machine): the repo's own visual preview (features/shell-ui/preview) was extended with workbench fixtures (fake repo, status, diff, log, branches) and driven in a browser - Files tab (toolbar, tree, unavailable root with its reason, empty view, bottom status strip), Git tab (facets with counts, document bar chips), a selected changed file showing the tinted diff with the +5 / -2 chips and the scope toggle, and the expanded recent-commits and branches sections. Screenshots: D:/DSH_workspace/.wsl-rust/gitm1-evidence/01-files-tab.png, 02-git-tab-diff.png, 03-git-history-branches.png."
  - "GIT-M2 merged (2026-09-13): PR #9 squash-merged to main as ac8a404 after CI run 34754007851 (ubuntu / macos / windows + live-qa-windows all success); main CI on the merge commit, run 34754306473, is green too. The branch was rebased onto main before landing (single commit, no conflicts), so the push was a --force-with-lease."
  - "Merged (2026-09-13): PR #6 squash-merged to main as ea0266d after CI run 34743750856 (ubuntu / macos / windows + live-qa-windows all success). main CI on the merge commit, run 34744029907, is also green on all four jobs. One follow-up commit went in before the merge: every tab's aria-controls now points at the single mounted 'workbench-panel' region instead of an id that only existed for the active tab."
  - "Owner acceptance feedback (2026-09-13): \"工作台的 banner 可以小一点，其他的没有问题\" - the workbench surface header was a 222 px card with a 32 px title. It now takes a new .shell-header--slim modifier (150 px, 24 px title, 22/30 px padding, tighter description) that keeps the artwork and the description; --compact was rejected because it is the immersive dsh/terminal strip that drops both. Scoped to the workbench surface only, with matching values at the 1050 px and 780 px breakpoints. Evidence: D:/DSH_workspace/.wsl-rust/gitm1-evidence/04-workbench-slim-banner.png (before/after pair 02 vs 04). pnpm check clean, vitest 127/127."
  - "Second acceptance round (2026-09-13): \"左右的空间也用起来吧，另外副标题的小字可以拿掉，这些改掉之后就可以继续M2了\". (1) The workbench surface now takes the whole width - .shell-workspace--wide lifts the 1200 px shell measure (max-width: none) for the header and the content together, because that measure is set for the prose-shaped surfaces and left the workbench as an island on a wide window; the tree + diff/editor pair is a tool. Verified with a 1920 px and a 2560 px render (the preview browser is 1280 px, so the page was mounted in a sized iframe). (2) The tab-strip subtitle ('环境关联的文件' / '环境关联的仓库（只读）') is gone and the now-dead fs.subtitle / git.subtitle keys were deleted. Evidence: D:/DSH_workspace/.wsl-rust/gitm1-evidence/05-workbench-wide-1920.png and 06-git-wide-1920.png."
  - "GIT-M2 (2026-09-13): stage / unstage / commit / discard. Backend: four repo-root-scoped commands, and run_git_raw now owns process construction (reads pin GIT_OPTIONAL_LOCKS=0, mutations keep the locks they need, every invocation pins GIT_EDITOR). git_unstage picks git restore --staged when there is a HEAD and git rm --cached -r -f when the repository has no commits yet, saying which it used in the report; neither can touch the worktree. git_commit trims its message, refuses an empty or >8000-byte one and refuses when nothing is staged - all before git runs. git_discard is restore --worktree only: never --staged, never a revision, never --hard. Every mutation answers with the fresh status. 7 new Rust tests (12 in the module) incl. unstage on an unborn HEAD and a discard proven to restore from the index rather than HEAD."
  - "GIT-M2 UI (2026-09-13): per-row stage / unstage / discard actions plus whole-tree stage-all / unstage-all on the Changes header (the backend takes a path or everything, so per-group buttons would promise a scope it cannot express); a commit box that belongs to the index rather than the selection, with the staged count, Ctrl/Cmd+Enter and a disabled-button hint that says which of the two conditions is missing; and the typed confirmation for discard (the localized git.discard.word). Row actions stay in the DOM and in the tab order, dimmed rather than hidden. The panel stopped advertising itself as read-only. vitest 134/134 (7 new M2 cases: the exact git_stage request, all-true unstage, unstage-all idle while nothing is staged, the commit gating both ways, the typed word, and a failed mutation surfacing the backend message). Visual pass caught two real defects, both fixed: no :disabled rule existed for .git-panel__action (a disabled confirm looked live) and two row actions squeezed the path column (now 240-360 px with a smaller action type size). Evidence: D:/DSH_workspace/.wsl-rust/gitm1-evidence/09-git-m2-controls-1920.png."
  - "One real defect the visual pass caught and fixed: the git panel's toolbar repeated the panel subtitle, and the surface header + panel heading both read '工作台' - the fix moved the subtitle into the tab strip and deleted both panels' redundant heading (the FS panel's too, so the two tabs stay consistent)."
