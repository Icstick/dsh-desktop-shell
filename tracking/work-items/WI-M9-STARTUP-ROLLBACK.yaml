acceptance_criteria:
  - "When a managed DSH repo upgrade or profile/plugin load leaves the instance unable to start, the supervisor rolls back to the last-known-good state and restarts."
  - "Two rollback classes: repo checkout (git last-good commit, dirty-tree safety) and profile/plugin snapshot (dshHome load-area restore)."
  - "Sessions/ledgers never roll back with the tree."
  - "Rollback only under explicit policy; bounded attempts; full audit trail."
security_impact: "High - rollback mutates the source checkout and dshHome; wrong rollback is worse than none. ADR-first design with safety analysis."
compatibility_impact: "Managed start/restart semantics gain a rollback phase; runtime report may surface rollback state."
