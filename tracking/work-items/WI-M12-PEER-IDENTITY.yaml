acceptance_criteria:
  - "Carrier split in dsh-local-transport: the framing/handshake/credential logic is shared across carriers; loopback TCP remains available as an explicit, reported degradation."
  - "Windows Named Pipe carrier: server accept loop + client connect + kernel-provided peer identity (GetNamedPipeClientProcessId + image path), with unit tests on this machine."
  - "Unix carrier (UDS + SO_PEERCRED / getpeereid) implemented and verified on the CI matrix before any carrier switch lands."
  - "Daemon: expected-Shell-path policy (override -> derived from layout -> fail closed) drives whether shell_control authority is granted; a same-user impostor process is rejected or downgraded, with an auditable record."
  - "Negative test: a same-user process holding a valid credential but a different image path cannot obtain shell_control (broker-relaxed path) after the carrier switch."
  - "H-2 status flips to closed only when the negative test exists on the shipped default carrier; until then it stays partially mitigated."
security_impact: "This is the fix for audit H-2 (self-reported Shell identity): the daemon stops trusting the credential alone for control-plane authority and adds a kernel-provided peer identity check. Must be fail-closed on missing/unresolvable identity."
compatibility_impact: "Carrier and daemon-discovery semantics change (pipe/socket name in the credential file; the TCP port becomes presence/fallback only). Envelope and capability wire semantics unchanged."
scope:
  - crates/local-transport/ (carrier split, named_pipe, peer identity)
  - crates/daemon/ (carrier selection, expected-path policy, authority wiring)
  - apps/desktop/src-tauri/src/daemon_client.rs (client carrier)
  - tests + live QA scripts + tracking/
