completed:
  - "M3 contract freeze (commit 2e35593): ADR-0015 (Desktop-owned Persistent Terminal on Windows ConPTY; human_surface only, agent_automation fail-closed), ADR-0016 (Notification content policy + local-first Usage auditability); terminal/notification/usage schemas and fixtures (53 schemas / 55 fixtures); AC-NOT-001/002, AC-USG-001/002, AC-TERM-001/002 added to the acceptance catalog."
  - "M3-B Persistent Terminal (commits f17d765, cb06671): crates/terminal-provider with a hand-rolled Windows ConPTY wrapper (CreatePseudoConsole + attribute-list spawn + bounded output queue + teardown that unblocks the reader first); Desktop-owned PTY registry independent of the Managed DSH process tree; terminal bridge commands (create/write/resize/close/status/list, 24-command ACL); output streamed to the Shell WebView via terminal://output Tauri events (AC-TERM-002); xterm.js (@xterm/xterm 6) terminal panel; AC-PTY-001 regression test proves the PTY keeps echoing across a Managed DSH stop/restart."
  - "M3-A Notification (commit ddbff7e): NotificationService with content-policy enforcement (AC-NOT-001: body only under explicit_body, schema-rejected otherwise), dedupeKey 60s TTL folding (AC-NOT-002: folded notifications return deduplicated:true and never re-audit), append-only AppData audit JSONL (rolling cap 1000), list/dismiss, runtime_changed auto-emission exactly once per supervisor state transition; Notifications rail and panel."
  - "M3-C Usage (commit ddbff7e): local-first UsageCollector (zero network code, AppData JSONL, rolling cap 4096), schema-semantics validation (source/period/tokens/currency/isEstimate, future timestamps rejected), snapshot with totals/estimateCount and since-filter; wiring from terminal sessions, notifications and runtime sessions with best-effort failure isolation; Usage rail and panel with estimate badges; AC-USG-001 privacy test proves persisted records never contain terminal/notification content."
  - "Diagnostics redaction (AC-LOG-001) remains satisfied by the M2 diagnostics report; M3 planned a dedicated diagnostics UI/log-export which was deferred (see remaining)."
remaining:
