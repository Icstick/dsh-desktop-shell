name: Architecture / ADR proposal
description: Propose a change to ownership, protocol, lifecycle, transport or trust boundary.
title: "[ADR] "
body:
  - type: textarea
    id: context
    attributes:
      label: Context and evidence
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Modules, protocols, migrations and security impact
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Verification gates
    validations:
      required: true
