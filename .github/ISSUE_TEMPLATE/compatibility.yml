name: Compatibility report
description: Report a DSH, platform, profile or adapter compatibility problem.
title: "[Compat] "
body:
  - type: input
    id: os
    attributes:
      label: OS and architecture
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop version or commit
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DSH version or Git SHA
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: DSH source
      options:
        - PATH / global install
        - Source checkout
        - Explicit executable
        - Custom command
    validations:
      required: true
  - type: dropdown
    id: ownership
    attributes:
      label: Ownership
      options:
        - Managed
        - Attached
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Node version, profile name, port policy and adapter status
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction and sanitized diagnostics
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not attach credentials, full settings, raw DSH_HOME or session contents.
          required: true
