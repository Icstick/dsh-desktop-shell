name: Bug report
description: Report a reproducible DSH Desktop Shell defect.
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shell UI
        - Discovery / Environment
        - Supervisor / Process
        - WebView
        - Adapter / Protocol
        - Terminal
        - Browser
        - Usage / Notification
        - Packaging
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Desktop version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, API keys, full DSH_HOME contents and raw session data.
          required: true
