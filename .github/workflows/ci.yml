name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux system deps (tauri/webkit)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Dependency audit (cargo-deny)
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Workspace tests (serial)
        run: cargo test --workspace -- --test-threads=1

      - name: Frontend typecheck
        working-directory: apps/desktop
        run: pnpm check

      - name: Frontend tests
        working-directory: apps/desktop
        run: pnpm test

      - name: ACL validation
        working-directory: apps/desktop
        run: node scripts/validate-acl.mjs

      - name: Spec validation
        run: node scripts/validate-specs.mjs

      - name: Debug build (no bundle)
        working-directory: apps/desktop
        run: pnpm exec tauri build --debug --no-bundle

  live-qa-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build debug (with CDP QA arg)
        working-directory: apps/desktop
        run: |
          (Get-Content src-tauri/tauri.conf.json -Raw).Replace('"fullscreen": false', '"fullscreen": false, "additionalBrowserArgs": "--remote-debugging-port=9333"') | Set-Content src-tauri/tauri.conf.json
          # tauri build only compiles the app bin; the standalone daemon
          # bin is a separate workspace target the live QA spawns directly.
          cargo build -p dsh-daemon --bin dsh-desktop-daemon
          pnpm exec tauri build --debug --no-bundle

      - name: Daemon live QA (envelope direct)
        run: node scripts/qa/live-daemon-qa.mjs

      - name: M7 live QA (CDP shell)
        run: node scripts/qa/live-m7-qa.mjs

      - name: Restore tauri config
        working-directory: apps/desktop
        run: git checkout -- src-tauri/tauri.conf.json