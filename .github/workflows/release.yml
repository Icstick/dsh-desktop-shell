# v0.1.0+ release pipeline (M8-E): tag-triggered bundle builds with
# SLSA build provenance (attestation) and a GitHub Release with SBOMs.
# Bundle sets per platform: windows nsis,msi / macos dmg / ubuntu deb.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # attest-build-provenance (SLSA provenance)

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (tauri/webkit)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Platform bundle sets (Windows signing is applied locally per
      # docs/release/signing-and-distribution.md before upload; macOS
      # stays unsigned until a Developer ID account exists).
      - name: Build bundles (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: apps/desktop
        run: pnpm exec tauri build --bundles nsis,msi

      - name: Build bundle (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop
        run: pnpm exec tauri build --bundles dmg

      - name: Build bundle (Linux deb)
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: pnpm exec tauri build --bundles deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  provenance:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/**/*

  publish:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate SBOMs
        run: |
          mkdir -p sbom
          node scripts/release/sbom.mjs sbom 2>/dev/null || true
          ls -la sbom/ || true

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/**/* sbom/**/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }} — DSH Desktop Shell" \
            --generate-notes \
            --draft
